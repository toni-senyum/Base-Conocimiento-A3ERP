; Copia este archivo como config.ini (en la misma carpeta scripts\) y
; rellena tus datos reales de conexión a la copia local de SQL Server.
;
; IMPORTANTE: config.ini contiene datos de conexión (y posiblemente
; credenciales). No lo compartas ni lo subas a ningún repositorio
; compartido / OneDrive con permisos abiertos. Mantenlo solo en local.

[sqlserver]
; Driver ODBC instalado en tu máquina. Los más habituales:
;   ODBC Driver 17 for SQL Server
;   ODBC Driver 18 for SQL Server
driver = ODBC Driver 17 for SQL Server

; Nombre del servidor/instancia. Ejemplos:
;   localhost
;   localhost\SQLEXPRESS
;   .\SQLEXPRESS
server = localhost\SQLEXPRESS

; Nombre de la base de datos (copia local del cliente)
database = NOMBRE_BASE_DE_DATOS

; Si usas autenticación de Windows (recomendado en local), deja esto en true
; y no rellenes user/password.
trusted_connection = true

; Si en cambio usas autenticación SQL (usuario/contraseña), pon
; trusted_connection = false y rellena estos dos campos:
user =
password =
